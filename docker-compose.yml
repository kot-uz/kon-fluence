services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kon
      POSTGRES_PASSWORD: kon
      POSTGRES_DB: kon_fluence
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kon -d kon_fluence']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data

  # Бакет создаётся один раз при старте
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb --ignore-existing local/kon-fluence"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://kon:kon@postgres:5432/kon_fluence
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET (не короче 32 символов)}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: kon-fluence
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  minio-data:
