name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kon
          POSTGRES_PASSWORD: kon
          POSTGRES_DB: kon_fluence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kon -d kon_fluence"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace server

      # Схема в коде и закоммиченные миграции не должны расходиться
      - name: Migrations are up to date
        working-directory: server
        run: |
          npx drizzle-kit generate
          git diff --exit-code -- drizzle
          test -z "$(git ls-files --others --exclude-standard drizzle)"

      # Миграции применяются на чистую базу
      - name: Apply migrations
        run: npm run db:migrate --workspace server
        env:
          DATABASE_URL: postgres://kon:kon@localhost:5432/kon_fluence
          JWT_SECRET: ci-secret-0123456789abcdef0123456789
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: ci
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci

      # Тесты сами поднимают Postgres через Testcontainers (Docker есть на раннере)
      - run: npm test --workspace server

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: kon-fluence-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
